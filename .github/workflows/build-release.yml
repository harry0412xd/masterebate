name: Build and Release Android APK

on:
  workflow_dispatch:  # Manual trigger
  push:
    tags:
      - 'v*'  # Full releases on version tags
    branches:
      - main
      - grok-chan

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create/update releases
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: 3.38.3
          channel: "stable"
          cache: true
          cache-key: deps-${{ hashFiles('**/pubspec.lock') }}
          cache-path: ${{ runner.tool_cache }}/flutter

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Decode release keystore
        run: |
          echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 -d > android/upload-keystore.jks

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.SIGNING_STORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.SIGNING_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.SIGNING_KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build release APK (arm64-only)
        run: |
          flutter build apk --release --target-platform=android-arm64 --no-shrink

      # Stable filename for Obtainium filtering
      - name: Rename APK for Obtainium
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/MasterRebate-arm64-v8a.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/MasterRebate-arm64-v8a.apk

      # ── Always update the Beta pre-release with the latest APK ─────────────
      # Obtainium tip: enable "Include prereleases" + "Use latest asset date as release date"
      # so it detects updates even though the tag stays "beta".
      - name: Update Beta Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta
          name: Beta ${{ github.run_number }} (${{ github.sha }})
          body: |
            ## MasterRebate Beta

            Continuous beta build

            | | |
            |---|---|
            | Branch | `${{ github.ref_name }}` |
            | Commit | `${{ github.sha }}` |
            | Run | #${{ github.run_number }} |

            ### Obtainium setup
            1. App source URL: `https://github.com/harry0412xd/masterebate`
            2. **Include prereleases**: ON
            3. **Use the latest asset date as the release date**: ON
            4. (Recommended) **Release date as version**: ON
            5. APK filter regex (optional): `MasterRebate-arm64-v8a\.apk`

            Download the latest APK below.
          files: build/app/outputs/flutter-apk/MasterRebate-arm64-v8a.apk
          prerelease: true
          draft: false
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Full versioned release (only when a v* tag is pushed) ──────────────
      - name: Create Versioned Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: build/app/outputs/flutter-apk/MasterRebate-arm64-v8a.apk
          prerelease: false
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
