name: Build and Release Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - grok-chan

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: 3.38.3
          channel: "stable"
          cache: true
          cache-key: deps-${{ hashFiles('**/pubspec.lock') }}
          cache-path: ${{ runner.tool_cache }}/flutter

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Decode release keystore
        run: |
          if [ -z "${{ secrets.SIGNING_KEY_BASE64 }}" ]; then
            echo "ERROR: SIGNING_KEY_BASE64 secret is empty"
            exit 1
          fi
          echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 -d > android/upload-keystore.jks
          SIZE=$(stat -c%s android/upload-keystore.jks)
          echo "Keystore size: $SIZE bytes"
          if [ "$SIZE" -lt 100 ]; then
            echo "ERROR: keystore file looks empty/invalid"
            exit 1
          fi

      - name: Create key.properties
        run: |
          if [ -z "${{ secrets.SIGNING_STORE_PASSWORD }}" ] || \
             [ -z "${{ secrets.SIGNING_KEY_PASSWORD }}" ] || \
             [ -z "${{ secrets.SIGNING_KEY_ALIAS }}" ]; then
            echo "ERROR: one or more signing secrets are empty"
            exit 1
          fi
          printf '%s
' \
            "storePassword=${{ secrets.SIGNING_STORE_PASSWORD }}" \
            "keyPassword=${{ secrets.SIGNING_KEY_PASSWORD }}" \
            "keyAlias=${{ secrets.SIGNING_KEY_ALIAS }}" \
            "storeFile=upload-keystore.jks" \
            > android/key.properties
          echo "key.properties keys:"
          cut -d= -f1 android/key.properties

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build release APK (universal)
        run: flutter build apk --release --no-shrink

      - name: Verify APK is signed
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          ls -la "$APK"
          if ! jarsigner -verify -verbose "$APK" 2>&1 | tee /tmp/jsig.txt | grep -q "jar verified"; then
            echo "ERROR: APK is not properly signed (jarsigner failed)"
            cat /tmp/jsig.txt
            exit 1
          fi
          echo "APK signature OK"
          if ! unzip -l "$APK" | grep -qE 'META-INF/.*\.(RSA|DSA|EC)'; then
            echo "ERROR: missing META-INF certificate (v1 signature)"
            unzip -l "$APK" | grep META-INF || true
            exit 1
          fi
          echo "v1 signing artifacts present"

      - name: Rename APK for Obtainium
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/MasterRebate.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/MasterRebate.apk

      - name: Update Beta Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta
          name: Beta ${{ github.run_number }} (${{ github.sha }})
          body: |
            ## MasterRebate Beta

            Continuous beta build (signed release APK)

            | | |
            |---|---|
            | Branch | `${{ github.ref_name }}` |
            | Commit | `${{ github.sha }}` |
            | Run | #${{ github.run_number }} |

            ### Obtainium setup
            1. App source URL: `https://github.com/harry0412xd/masterebate`
            2. **Include prereleases**: ON
            3. **Use the latest asset date as the release date**: ON
            4. (Recommended) **Release date as version**: ON
            5. APK filter regex (optional): `MasterRebate\.apk`

            Download **MasterRebate.apk** below.
          files: build/app/outputs/flutter-apk/MasterRebate.apk
          prerelease: true
          draft: false
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Versioned Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: build/app/outputs/flutter-apk/MasterRebate.apk
          prerelease: false
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
